# Full-stack Agentic SDLC.
#
#   docker compose up -d                       # infra only (postgres/redis/minio)
#   docker compose --profile app up -d --build # + backend, worker, beat, frontend
#
# The app profile is opt-in so `docker compose up` stays the fast path for local
# development against a natively-run backend.

services:

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdlc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdlc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_sdlc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdlc_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Application (profile: app) ──────────────────────────────────────────────

  backend:
    profiles: ["app"]
    build: ./backend
    restart: always
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdlc_user}:${POSTGRES_PASSWORD:-sdlc_pass}@postgres:5432/${POSTGRES_DB:-agentic_sdlc}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    # Migrations run on boot so a fresh volume is usable without a manual step.
    # Kept on one physical line deliberately: YAML's ">" folding only joins
    # same-indentation lines with a space — a more-indented continuation (as
    # this used to have) is preserved as a literal newline, which turns one
    # `sh -c "..."` string into multiple shell statements and breaks the
    # gunicorn flags onto their own (invalid) command.
    command: >
      sh -c "alembic upgrade head && gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --timeout 120 --access-logfile -"

  worker:
    profiles: ["app"]
    build: ./backend
    restart: always
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdlc_user}:${POSTGRES_PASSWORD:-sdlc_pass}@postgres:5432/${POSTGRES_DB:-agentic_sdlc}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      # services/sandbox_service.py's Docker-outside-of-Docker path fix (see
      # that module's docstring, point 4): the socket below talks to the
      # HOST's daemon, so a bind mount handed to it must be a host path, not
      # this container's own. SANDBOX_HOST_PATH must equal wherever
      # ./sandbox_data resolves to on the actual deploy host (e.g.
      # /opt/agentic-sdlc/sandbox_data on the VPS) — set it in backend/.env,
      # it cannot be inferred from inside the container.
      SANDBOX_WORKDIR: /tmp/adlc-sandbox
      SANDBOX_HOST_PATH: ${SANDBOX_HOST_PATH:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Docker-outside-of-Docker: the QA agent's execution sandbox
    # (app/services/sandbox_service.py) asks the HOST's own Docker daemon to
    # run each ticket's tests in a throwaway sibling container, rather than
    # nesting a second daemon inside this one. The socket's group ownership on
    # the host decides who may use it; DOCKER_GID must be that group's numeric
    # id (`getent group docker | cut -d: -f3` on the host — commonly 999 on
    # Debian/Ubuntu, but verify rather than assume) so the container's non-root
    # `appuser` (see backend/Dockerfile) can reach it without running as root.
    # `./sandbox_data` is a real host directory, not an opaque named volume,
    # because sandbox_service needs to hand the *host* path of a run's
    # checkout to the sibling containers it creates (SANDBOX_HOST_PATH above).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox_data:/tmp/adlc-sandbox
    group_add:
      - "${DOCKER_GID:-999}"
    command: celery -A celery_app worker --loglevel=info
    # Override the backend image's baked-in HEALTHCHECK (curl localhost:8000) —
    # this container runs Celery, not gunicorn, so nothing ever listens on
    # 8000 here and that check would always report unhealthy.
    #
    # `celery inspect ping` looked like the "correct" liveness probe but is a
    # round-trip through the control bus (broker) rather than a real liveness
    # check, and proved flaky even run by hand against a worker whose logs
    # already said "ready". `command:` above replaces the image's CMD with no
    # shell wrapper, so PID 1 in this container *is* the celery process —
    # checking that directly is simpler and doesn't depend on the control bus
    # being responsive.
    healthcheck:
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  beat:
    profiles: ["app"]
    build: ./backend
    restart: always
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdlc_user}:${POSTGRES_PASSWORD:-sdlc_pass}@postgres:5432/${POSTGRES_DB:-agentic_sdlc}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    # Drives the nightly retention prune — a documented policy nobody executes
    # is an audit finding.
    command: celery -A celery_app beat --loglevel=info
    # Same override reason as `worker` above. Beat has no "inspect ping"
    # equivalent (it isn't a task-consuming worker) — the schedule file being
    # written/updated is the cheapest real evidence the loop is alive.
    healthcheck:
      test: ["CMD-SHELL", "test -f celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:8000}
    restart: always
    depends_on: [backend]
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
