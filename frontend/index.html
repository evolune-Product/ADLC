<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme boot. Runs before the first paint and before the stylesheet has
      anything to key off, so the correct palette is on <html> by the time
      anything is drawn.

      This must stay inline and stay in <head>: an external file — or the same
      logic inside React — cannot execute until after the browser has already
      painted a frame, which is exactly the white flash it exists to prevent.

      Keep the storage key in sync with THEME_STORAGE_KEY in src/lib/theme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('adlc-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          if (theme === 'dark') root.classList.add('dark')
          root.style.colorScheme = theme
        } catch (e) {
          /* private mode, or no matchMedia — fall through to the CSS default */
        }
      })()
    </script>

    <title>Evolune OS — Ship agent work you can actually approve</title>
    <meta
      name="description"
      content="Evolune OS runs your whole delivery loop with AI agents — plan, code, test, review — and stops at an approval gate a human controls. Every deploy is policy-checked and written to an audit log."
    />
    <link rel="canonical" href="https://evoluneos.com/" />

    <!-- The browser chrome follows the page. Two entries so the address bar is
         right in both themes without JavaScript having to update it. -->
    <meta name="theme-color" content="#f5efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08070a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evolune OS" />
    <meta property="og:title" content="Evolune OS — Ship agent work you can actually approve" />
    <meta
      property="og:description"
      content="The governed execution layer for AI software delivery. Ticket to production, with a gate in the middle that a human controls."
    />
    <meta property="og:url" content="https://evoluneos.com/" />
    <!-- A raster, not the SVG the rest of the site's art is drawn in: Facebook,
         X, LinkedIn and Slack all refuse SVG in a card and fall back to no
         image at all. Regenerate with scripts/og.mjs if the headline changes. -->
    <meta property="og:image" content="https://evoluneos.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Evolune OS — the delivery pipeline drawn as a rail of agent stages stopping at a red approval gate before dev, qa and prod."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evolune OS — Ship agent work you can actually approve" />
    <meta
      name="twitter:description"
      content="The governed execution layer for AI software delivery. Ticket to production, with a gate in the middle that a human controls."
    />
    <meta name="twitter:image" content="https://evoluneos.com/og.png" />

    <!--
      Structured data lives here rather than being injected by React, because a
      crawler that does not run JavaScript still gets it, and because a SPA that
      appends a <script type="application/ld+json"> per route without removing
      the previous one ends up publishing contradictory graphs. Per-page schema
      (FAQPage, and so on) is added by <Seo>, which cleans up after itself.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://evoluneos.com/#organization",
            "name": "Evolune EdgeTech LLP",
            "url": "https://evoluneos.com/",
            "brand": { "@type": "Brand", "name": "Evolune OS" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://evoluneos.com/#software",
            "name": "Evolune OS",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://evoluneos.com/#organization" },
            "description": "Evolune OS is an agentic development life cycle (ADLC) platform. AI agents plan, write, test and review changes; every production deploy stops at a human approval gate and a policy check, and is written to an immutable audit log.",
            "featureList": [
              "Multi-agent delivery pipeline: plan, code, test, review",
              "Human approval gate on every production deploy",
              "Policy engine: minimum approvers, reviewer score thresholds, protected paths, per-run cost caps",
              "Immutable audit log with configurable retention and CSV evidence export",
              "Bring your own model key across Anthropic, OpenAI, Azure OpenAI, any OpenAI-compatible endpoint, or local Ollama",
              "GitHub, GitLab, Jira, Linear and Slack integration",
              "Self-hosted or VPC deployment"
            ],
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "USD",
                "category": "free",
                "description": "25 runs a month, one project, your own model key. No card."
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "100",
                "priceCurrency": "USD",
                "category": "subscription",
                "description": "For a team putting real tickets through the pipeline."
              },
              {
                "@type": "Offer",
                "name": "Enterprise",
                "price": "5000",
                "priceCurrency": "USD",
                "category": "subscription",
                "description": "25 seats, unlimited runs, approval policies, self-hosted or VPC."
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
