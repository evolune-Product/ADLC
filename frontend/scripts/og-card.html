<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #08070a;
        background-image: radial-gradient(90% 120% at 22% -10%, rgba(232,99,42,0.20) 0%, transparent 62%);
        color: #f5efe6;
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(52,45,61,0.55) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(52,45,61,0.55) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(to bottom, transparent 40%, black 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 40%, black 100%);
        opacity: 0.5;
      }
      .wrap { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand span { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      h1 {
        margin-top: auto;
        font-size: 88px; line-height: 0.95; font-weight: 800;
        letter-spacing: -0.035em; max-width: 17ch;
      }
      .lit { background: linear-gradient(96deg, #f5efe6 0%, #f5a623 42%, #e8632a 100%);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin-top: 26px; font-size: 25px; line-height: 1.45; color: #a8a099; max-width: 54ch; }
      .rail { margin-top: 44px; display: flex; align-items: center; gap: 0; }
      .node { display: flex; align-items: center; }
      .dot { width: 13px; height: 13px; border-radius: 999px; }
      .seg { width: 54px; height: 2px; }
      .cap { position: absolute; bottom: 0; left: 0; }
      .foot { margin-top: 30px; font-family: 'JetBrains Mono', ui-monospace, monospace;
              font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #7d766f; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="34" height="34">
          <rect x="2" y="3" width="2.6" height="18" rx="1" fill="#f5efe6" opacity="0.55" />
          <rect x="19.4" y="3" width="2.6" height="18" rx="1" fill="#f5efe6" opacity="0.55" />
          <rect x="6" y="10.7" width="12" height="2.6" rx="1.3" fill="#E8632A" />
          <circle cx="12" cy="6" r="2.1" fill="#F5A623" />
        </svg>
        <span>ADLC</span>
      </div>

      <h1>Ship agent work you can <span class="lit">actually approve.</span></h1>
      <p>Agents plan, write, test and review. Then everything stops at a gate a human controls — policy-checked, and written down.</p>

      <div class="rail">
        <span class="dot" style="background:#f5a623"></span>
        <span class="seg" style="background:#f5a623"></span>
        <span class="dot" style="background:#f5a623"></span>
        <span class="seg" style="background:#f5a623"></span>
        <span class="dot" style="background:#f5a623"></span>
        <span class="seg" style="background:#f5a623"></span>
        <span class="dot" style="background:#f5a623"></span>
        <span class="seg" style="background:linear-gradient(90deg,#f5a623,#f2545b)"></span>
        <span class="dot" style="width:22px;height:22px;background:#f2545b;box-shadow:0 0 0 8px rgba(242,84,91,0.18)"></span>
        <span class="seg" style="background:rgba(125,118,111,0.4)"></span>
        <span class="dot" style="background:rgba(125,118,111,0.6)"></span>
        <span class="seg" style="background:rgba(125,118,111,0.4)"></span>
        <span class="dot" style="background:rgba(125,118,111,0.6)"></span>
        <span class="seg" style="background:rgba(125,118,111,0.4)"></span>
        <span class="dot" style="background:rgba(125,118,111,0.6)"></span>
      </div>

      <div class="foot">Planner · Coder · QA · Reviewer &nbsp;→&nbsp; Approval gate &nbsp;→&nbsp; dev · qa · prod</div>
    </div>
  </body>
</html>
